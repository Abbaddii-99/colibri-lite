name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y build-essential libomp-dev
      shell: bash

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install mingw --version 14.2.0 --no-progress -y
        $mingwPath = "C:\ProgramData\chocolatey\lib\mingw\tools\install\x86_64-14.2.0-release-win32-seh-ucrt-rt_v12-rev0\bin"
        if (-not (Test-Path $mingwPath)) {
          $mingwPath = "C:\ProgramData\chocolatey\lib\mingw64\tools\install\mingw64\bin"
        }
        if (-not (Test-Path $mingwPath)) {
          $mingwPath = (Get-Command gcc -ErrorAction SilentlyContinue).Source | Split-Path -Parent
        }
        echo "$mingwPath" >> $env:GITHUB_PATH
      shell: bash

    - name: Build modular engine
      run: |
        cd c
        if (Test-Path obj) { make clean }
        $cpuCount = [Environment]::ProcessorCount
        if ($cpuCount -lt 1) { $cpuCount = 4 }
        make -j$cpuCount
      env:
        CC: gcc
      shell: bash

    - name: Test help
      run: |
        cd c
        ./glm --help
      shell: bash

    - name: Smoke test (no model required)
      run: |
        cd c/tests
        python smoke_test.py
      shell: bash

    - name: Compile original monolithic glm.c
      run: |
        cd c/original
        gcc -std=c11 -O3 -fopenmp -Wall -Wextra -Wno-unused-parameter -Wno-unused-function -Wno-unknown-pragmas -Wno-misleading-indentation -D_FILE_OFFSET_BITS=64 -Iinclude glm.c -o ../glm_orig -lm -lpthread
      shell: bash

    - name: Run regression test (oracle)
      run: |
        cd c
        python tests/regression_test.py
      shell: bash