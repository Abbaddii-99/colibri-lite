name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y build-essential libomp-dev
      shell: bash

    - name: Install mingw (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install mingw --version 14.2.0 --no-progress -y
        refreshenv
      shell: powershell

    - name: Build modular engine
      run: |
        cd c
        if [ -d "obj" ]; then make clean; fi
        make -j$(nproc 2>/dev/null || echo 4)
      env:
        CC: gcc
      shell: bash

    - name: Test help
      run: |
        cd c
        ./glm --help
      shell: bash

    - name: Smoke test (no model required)
      run: |
        cd c/tests
        python smoke_test.py
      shell: bash

    - name: Compile original monolithic glm.c
      run: |
        cd c/original
        gcc -std=c11 -O3 -fopenmp -Wall -Wextra -Wno-unused-parameter -Wno-unused-function -Wno-unknown-pragmas -Wno-misleading-indentation -D_FILE_OFFSET_BITS=64 -Iinclude glm.c -o ../glm_orig -lm -lpthread
      shell: bash

    - name: Run regression test (oracle)
      run: |
        cd c
        python tests/regression_test.py
      shell: bash